<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🛍️ Tiendas - Japan Sicko Trip</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecera">

        <div class="titulo">

            <h1>
                🛍️ Tiendas
            </h1>

            <p>
                Las mejores tiendas de segunda mano de Japón
            </p>

        </div>

    </header>


    <main>

        <section class="intro">

            <h2>
                🏪 Mis tiendas imprescindibles
            </h2>

            <p>
                Una selección de las mejores cadenas y tiendas de segunda mano
                para buscar videojuegos, retro, anime, figuras, música y mucho más.
            </p>

        </section>


        <nav class="filtros">

            <button
                type="button"
                class="filtro activo"
                data-filtro="todas"
            >
                🏪 Todas
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="videojuegos"
            >
                🎮 Videojuegos
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="retro"
            >
                👾 Retro
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="anime"
            >
                🎌 Anime
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="figuras"
            >
                🧸 Figuras
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="musica"
            >
                💿 Música
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="baratas"
            >
                💴 Mejores precios
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="imprescindibles"
            >
                ⭐ Imprescindibles
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="favoritos"
            >
                ❤️ Quiero ir
            </button>

        </nav>


        <div id="contador" class="contador"></div>


        <div id="contenido-tiendas"></div>

    </main>


    <script src="app.js"></script>

    <script src="../menu.js"></script>
</body>
</html>
