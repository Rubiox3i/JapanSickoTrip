<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Conciertos de Música - Japan Sicko Trip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecera">

        <a href="../index.html" class="volver">
            ← Volver
        </a>

        <div class="titulo">

            <h1>
                🎵 Conciertos de Música
            </h1>

            <p>
                Artistas y grupos que quiero ver en Japón
            </p>

        </div>

    </header>

    <main>

        <section class="intro">

            <h2>
                Mis artistas
            </h2>

            <p>
                Una lista de artistas que me gustaría ver en directo durante mi viaje por Japón.
            </p>

        </section>

        <nav class="filtros">

            <button
                type="button"
                class="filtro activo"
                data-filtro="todos"
            >
                🎵 Todos
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="rock"
            >
                🎸 Heavy / Rock
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="jpop"
            >
                🎵 J-Pop
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="idols"
            >
                🎤 Idols
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="vocaloid"
            >
                🤖 Vocaloid
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="favoritos"
            >
                ⭐ Quiero ver
            </button>

        </nav>

        <div
            id="contador"
            class="contador"
        ></div>

        <div
            id="contenido-conciertos"
        ></div>

    </main>

    <script src="app.js"></script>

</body>
</html>
