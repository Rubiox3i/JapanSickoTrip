<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#090914">

    <title>Mapa Interactivo - Japan Sicko Trip</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Kaku+Gothic+Antique:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../seccion-theme.css">
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet LOCAL -->
    <link
        rel="stylesheet"
        href="leaflet/leaflet.css"
    >

</head>


<body>


    <header class="cabecera-mapa">
        <div class="cabecera-contenido">
            <div class="marca">
                <span class="marca-icono" aria-hidden="true">🏯</span>
                <span class="marca-texto"><span>JAPAN</span><span>SICKO TRIP</span></span>
            </div>
            <div class="cabecera-titulo">
                <p class="titulo-japones">地図 — CHIZU</p>
                <h1>Mapa interactivo</h1>
                <p class="subtitulo-cabecera">EXPLORA JAPÓN A TU MANERA</p>
            </div>
            <div aria-hidden="true"></div>
        </div>
    </header>


    <main>


        <!-- ==================================================
             MAPA
             ================================================== -->

        <section class="mapa-section">

            <div class="mapa-titulo">

                <h2>
                    Mi mapa de Japón
                </h2>

                <p>
                    Busca un lugar o haz clic directamente
                    sobre el mapa para seleccionarlo.
                </p>

            </div>


            <!-- BUSCADOR -->

            <div class="buscador">

                <input
                    type="text"
                    id="buscador-mapa"
                    placeholder="🔎 Buscar un lugar en Japón..."
                    autocomplete="off"
                >

                <div
                    id="resultados-busqueda"
                    class="resultados-busqueda"
                ></div>

            </div>


            <!-- MAPA -->

            <div id="map"></div>

        </section>


        <!-- ==================================================
             MIS SITIOS
             ================================================== -->

        <section class="sitios-section">

            <div class="sitios-titulo">

                <div>

                    <h2>
                        📍 Mis sitios
                    </h2>

                    <p>
                        Lugares que has guardado en el mapa.
                    </p>

                </div>


                <span
                    id="contador-sitios"
                    class="contador-sitios"
                >
                    0 sitios
                </span>

            </div>


            <div
                id="lista-sitios"
                class="lista-sitios"
            ></div>

        </section>


    </main>


    <!-- Leaflet LOCAL -->

    <script src="leaflet/leaflet.js"></script>

    <!-- Nuestra aplicación -->

    <script src="app.js"></script>


    <script src="../menu.js"></script>
</body>

</html>
